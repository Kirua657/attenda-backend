server:
  port: 8080
spring:
  application:
    name: attenda-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attenda}
    username: ${DB_USER:attenda_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true
server.error:
  include-message: never
  include-stacktrace: never
